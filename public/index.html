<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de plantillas</title>
<style>
  :root {
    --bg: #e5e7eb; --panel: #ffffff; --linea: #d1d5db; --texto: #1f2937;
    --suave: #6b7280; --acento: #2563eb; --aviso: #b45309; --error: #b91c1c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto); background: var(--bg);
    display: grid; grid-template-rows: 1fr auto; grid-template-columns: 170px 1fr 330px;
    grid-template-areas: "barra lienzo panel" "barra estado panel";
  }
  /* Botones del editor, en columna a la izquierda */
  #barra {
    grid-area: barra; background: var(--panel); border-right: 1px solid var(--linea);
    padding: 10px; display: flex; flex-direction: column; gap: 6px; overflow: auto;
  }
  #barra > button, #barra > a.boton { text-align: left; }
  #barra .sep { height: 1px; background: var(--linea); margin: 4px 0; flex: none; }
  #barra label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button {
    background: #fff; border: 1px solid var(--linea); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--acento); }
  button.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
  button.peligro:hover { border-color: var(--error); color: var(--error); }
  #lienzo { grid-area: lienzo; overflow: auto; padding: 24px; }
  #pagina {
    position: relative; margin: 0 auto; background-color: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,.25); user-select: none; touch-action: none;
  }
  #estado {
    grid-area: estado; background: var(--panel); border-top: 1px solid var(--linea);
    padding: 3px 10px; color: var(--suave); display: flex; gap: 16px; min-height: 24px;
  }
  #estado .error { color: var(--error); }
  #panel {
    grid-area: panel; background: var(--panel); border-left: 1px solid var(--linea);
    overflow: auto; padding: 10px;
  }
  #panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave);
    margin: 14px 0 6px; border-bottom: 1px solid var(--linea); padding-bottom: 3px;
  }
  #panel h2:first-child { margin-top: 0; }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .fila.una { grid-template-columns: 1fr; }
  .fila.cuatro { grid-template-columns: repeat(4, 1fr); }
  label.campo { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--suave); }
  label.campo input, label.campo select, label.campo textarea {
    font-size: 13px; color: var(--texto); padding: 3px 5px; border: 1px solid var(--linea);
    border-radius: 4px; width: 100%; background: #fff;
  }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .ayuda { color: var(--suave); font-size: 12px; }
  .aviso { color: var(--aviso); font-size: 12px; }
  .col { border: 1px solid var(--linea); border-radius: 6px; padding: 6px; margin-bottom: 6px; }
  .col .fila { margin-bottom: 4px; }
  .col-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .grip {
    width: 24px; height: 24px; flex: none; display: inline-flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 4px; border-radius: 4px;
    cursor: grab; touch-action: none;
  }
  .grip::before, .grip::after { content: ''; width: 14px; height: 2px; border-radius: 1px; background: var(--suave); }
  .grip:hover { background: #eef2ff; }
  .grip:hover::before, .grip:hover::after { background: var(--acento); }
  .col.arrastrando { opacity: .75; background: #eff6ff; border-color: var(--acento); box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  body.ordenando, body.ordenando * { cursor: grabbing !important; user-select: none; }
  #xml { width: 100%; height: 220px; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  button:disabled { opacity: .45; cursor: not-allowed; border-color: var(--linea); }
  #p-estado { font-weight: 600; color: var(--texto); }
  #p-estado.sucio { color: var(--aviso); }

  /* Lista de plantillas */
  dialog#lista {
    border: 1px solid var(--linea); border-radius: 10px; padding: 14px 16px;
    width: min(760px, 94vw); max-height: 82vh; color: var(--texto);
  }
  dialog#lista::backdrop { background: rgba(0,0,0,.35); }
  .lista-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .lista-cab h3 { margin: 0; font-size: 16px; }
  .lista-barra { display: flex; gap: 6px; margin-bottom: 8px; }
  .lista-barra input {
    flex: 1; padding: 4px 8px; border: 1px solid var(--linea); border-radius: 6px; background: #fff;
  }
  #l-msg { min-height: 18px; margin: 4px 0; }
  #l-msg.error { color: var(--error); }
  .tabla-lista { width: 100%; border-collapse: collapse; }
  .tabla-lista th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--suave); border-bottom: 1px solid var(--linea); padding: 4px 6px;
  }
  .tabla-lista td { border-bottom: 1px solid #eef0f3; padding: 6px; vertical-align: middle; }
  .tabla-lista td.acciones { text-align: right; white-space: nowrap; }
  .tabla-lista td.acciones > * { margin-left: 4px; }
  a.boton {
    display: inline-block; background: #fff; border: 1px solid var(--linea); border-radius: 6px;
    padding: 4px 10px; color: inherit; text-decoration: none;
  }
  a.boton:hover { border-color: var(--acento); }

  /* Elementos del lienzo */
  .el { position: absolute; z-index: 2; cursor: move; outline: 1px dashed rgba(0,0,0,.22); overflow: visible; }
  .el.sel { outline: 2px solid var(--acento); z-index: 5; }
  .el .contenido { width: 100%; height: 100%; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
  .el.logo .contenido {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: repeating-linear-gradient(45deg, #f3f4f6, #f3f4f6 6px, #e5e7eb 6px, #e5e7eb 12px);
    color: var(--suave); font-size: 11px;
  }
  .el.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .el.linea { outline: none; }
  .el.linea.sel { outline: 2px solid var(--acento); }
  .el.linea .trazo { position: absolute; left: 0; right: 0; top: 50%; background: #000; }
  .asa {
    position: absolute; right: -6px; bottom: -6px; width: 11px; height: 11px;
    background: var(--acento); border: 1px solid #fff; cursor: nwse-resize; z-index: 6;
  }
  .rot {
    position: absolute; left: 50%; top: -26px; width: 12px; height: 12px; margin-left: -6px;
    border-radius: 50%; background: #fff; border: 2px solid var(--acento); cursor: grab; z-index: 6;
  }
  .rot::after {
    content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 12px;
    margin-left: -.5px; background: var(--acento);
  }
  .marca { position: absolute; left: 0; top: 0; z-index: 0; overflow: hidden; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .marca.sel { outline: 2px solid var(--acento); outline-offset: -2px; }
  .marca-centro { white-space: pre; line-height: 1; text-align: center; }
  .marca-centro img { display: block; max-width: none; }
  .tabla-libre { width: 100%; border-collapse: collapse; table-layout: fixed; background: #fff; }
  .tabla-libre th, .tabla-libre td { padding: 0 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #475569; font-weight: 400; }
  .tabla-libre th { color: #0f172a; font-weight: 600; }
  /* Vista previa con datos de prueba */
  dialog#previa { border: 1px solid var(--linea); border-radius: 10px; padding: 0; width: 96vw; height: 94vh; max-width: none; color: var(--texto); }
  dialog#previa[open] { display: flex; flex-direction: column; }
  dialog#previa::backdrop { background: rgba(0,0,0,.45); }
  .previa-cab { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--linea); }
  .previa-cab h3 { margin: 0; font-size: 16px; flex: 1; }
  .previa-cuerpo { flex: 1; display: flex; min-height: 0; }
  #previa-paginas { flex: 1; overflow: auto; background: #e5e7eb; padding: 16px; }
  #previa-lateral { width: 340px; border-left: 1px solid var(--linea); padding: 10px 12px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  #previa-json { flex: 1; min-height: 220px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 6px; border: 1px solid var(--linea); border-radius: 6px; resize: none; white-space: pre; }
  #previa-avisos { font-size: 12px; margin: 0; }
  #previa-avisos.error { color: var(--error); }
  .pv-pagina { position: relative; background: #fff; margin: 0 auto 6px; box-shadow: 0 1px 6px rgba(0,0,0,.25); overflow: hidden; }
  .pv-num { text-align: center; font-size: 11px; color: var(--suave); margin-bottom: 14px; }
  .pv-el { position: absolute; }
  .pv-el .c { width: 100%; height: 100%; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
  .pv-el img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pv-el .trazo { position: absolute; left: 0; right: 0; top: 50%; background: #000; }
  .pv-el > .pv-tabla { position: static; }
  .pv-tabla { position: absolute; border-collapse: collapse; table-layout: fixed; }
  .pv-tabla th, .pv-tabla td { padding: 0 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 400; }
  .pv-tabla th { font-weight: 600; background: #e2e8f0; }
  .falta { background: #fde68a; }
  .guia-margen { position: absolute; border: 1px dashed #e11d48; pointer-events: none; opacity: .55; }
  .guia-banda { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--acento); pointer-events: none; opacity: .7; }
  .guia-banda span {
    position: absolute; left: 3px; top: -15px; font-size: 10px; color: var(--acento);
    background: rgba(255,255,255,.85); padding: 0 3px;
  }
  .cuerpo-zona { position: absolute; overflow: hidden; cursor: pointer; background: rgba(37,99,235,.04); }
  .cuerpo-zona.sel { outline: 2px solid var(--acento); z-index: 1; }
  .cuerpo-zona table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .cuerpo-zona th, .cuerpo-zona td {
    border-bottom: 1px solid #cbd5e1; padding: 0 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .cuerpo-zona th { background: #e2e8f0; font-weight: 600; }
  .cuerpo-zona td { color: #64748b; }
</style>
</head>
<body>

<div id="barra">
  <a id="b-volver" class="boton" hidden>← Volver</a>
  <span id="sep-volver" class="sep" hidden></span>
  <button id="b-plantillas" title="Plantillas guardadas en el servidor">Plantillas</button>
  <button id="b-guardar" class="principal" title="Guardar en el servidor (Ctrl+S)">Guardar</button>
  <button id="b-guardar-como" title="Guardar con otro nombre (Ctrl+Mayús+S)">Guardar como…</button>
  <span class="sep"></span>
  <button data-add="logo" title="Añadir logo o imagen">+ Logo</button>
  <button data-add="texto" title="Añadir texto">+ Texto</button>
  <button data-add="linea" title="Añadir línea horizontal">+ Línea</button>
  <button data-add="rectangulo" title="Añadir rectángulo">+ Rectángulo</button>
  <button data-add="tabla" title="Añadir una tabla a la cabecera o al pie (distinta de la del cuerpo)">+ Tabla</button>
  <button id="b-marca" title="Marca de agua a página completa (texto o imagen, girada y casi transparente)">Marca de agua</button>
  <span class="sep"></span>
  <button id="b-duplicar" title="Duplicar (Ctrl+D)">Duplicar</button>
  <button id="b-eliminar" class="peligro" title="Eliminar (Supr)">Eliminar</button>
  <span class="sep"></span>
  <button id="b-deshacer" title="Deshacer (Ctrl+Z)">Deshacer</button>
  <button id="b-rehacer" title="Rehacer (Ctrl+Y)">Rehacer</button>
  <span class="sep"></span>
  <label>Zoom
    <select id="zoom">
      <option value="0.5">50 %</option><option value="0.75">75 %</option>
      <option value="1" selected>100 %</option><option value="1.25">125 %</option>
      <option value="1.5">150 %</option><option value="2">200 %</option>
    </select>
  </label>
  <span class="sep"></span>
  <button id="b-nueva">Nueva</button>
  <button id="b-ejemplo">Ejemplo factura</button>
  <button id="b-importar">Importar XML</button>
  <button id="b-previa" title="Ver la plantilla con datos de prueba">Previsualizar</button>
  <button id="b-exportar" title="Descargar el XML de lo que hay en pantalla">Exportar XML</button>
  <input type="file" id="f-importar" accept=".xml,text/xml,application/xml" hidden>
  <input type="file" id="f-imagen" accept="image/*" hidden>
</div>
<datalist id="dl-listas"></datalist>
<datalist id="dl-campos-todos"></datalist>

<div id="lienzo"><div id="pagina"></div></div>

<div id="estado"><span id="p-estado"></span><span id="coords">&nbsp;</span><span id="mensaje"></span></div>

<div id="panel"></div>

<dialog id="lista">
  <div class="lista-cab">
    <h3>Plantillas guardadas</h3>
    <button id="l-cerrar">Cerrar</button>
  </div>
  <div class="lista-barra">
    <input id="l-filtro" type="search" placeholder="Filtrar por nombre…" autocomplete="off">
    <button id="l-nueva">Nueva</button>
    <button id="l-ejemplo">Ejemplo factura</button>
  </div>
  <p id="l-msg" class="ayuda"></p>
  <div id="l-tabla"></div>
</dialog>

<dialog id="previa">
  <div class="previa-cab">
    <h3>Vista previa con datos de prueba</h3>
    <label>Zoom <select id="previa-zoom"><option value="0.6">60 %</option><option value="0.8" selected>80 %</option><option value="1">100 %</option></select></label>
    <button id="previa-cerrar">Cerrar</button>
  </div>
  <div class="previa-cuerpo">
    <div id="previa-paginas"></div>
    <div id="previa-lateral">
      <strong>Datos de prueba (JSON)</strong>
      <textarea id="previa-json" spellcheck="false"></textarea>
      <div class="fila">
        <button id="previa-aplicar" class="principal">Aplicar</button>
        <button id="previa-ejemplo">Restaurar ejemplo</button>
      </div>
      <button id="previa-muchas">Probar con 60 líneas (paginación)</button>
      <p id="previa-avisos" class="ayuda"></p>
      <p class="ayuda">Los datos se guardan dentro de la plantilla (<code>&lt;datos_prueba&gt;</code>). La cabecera y el pie se repiten en todas las páginas; es una decisión abierta.</p>
    </div>
  </div>
</dialog>

<script>
'use strict';

/* ------------------------------------------------------------------ */
/*  Constantes y estado                                                */
/* ------------------------------------------------------------------ */
const MM = 96 / 25.4;               // píxeles de pantalla por mm (zoom 1)
const PT = 25.4 / 72;               // mm por punto tipográfico
const FORMATOS = { A3: [297, 420], A4: [210, 297], A5: [148, 210] };
// Configuración que pone el paquete de Laravel al servir el editor; sin ella (modo suelto), lo de siempre.
const CONFIG = window.GeneradorPlantillas || {};
const CLAVE_LS = CONFIG.claveLocal || 'editor-plantillas:sesion';
const API = CONFIG.api || 'api/';

let servidor = false;               // true si la API responde (paquete de Laravel o php -S ... router.php)
let origen = null;                  // {nombre, version} de la plantilla del servidor que se edita
let guardadoXml = '';               // XML tal como se abrió o guardó por última vez
let uid = 1;
let doc = plantillaEjemplo();
let sel = null;                     // id de elemento, 'cuerpo' o null
let zoom = 1;
let drag = null;
const TIPOS_IMAGEN = ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/svg+xml'];
const MAX_IMAGEN = 500 * 1024;      // bytes por imagen; se guarda en base64 dentro del XML
const urlsImagen = new Map();       // base64 -> URL de blob (evita redecodificar al arrastrar)
const refs = {};                    // inputs del panel que se sincronizan al arrastrar

const $ = (s) => document.querySelector(s);
const pagina = $('#pagina');
const panel = $('#panel');

function nuevoId() { return 'e' + (uid++); }

/* Datos que recibe el informe (el generador de facturas los rellena). El programa puede dar los suyos. */
const CAMPOS = CONFIG.campos || {   // se usan como {{grupo.campo}}
  factura: ['serie', 'numero', 'numero_completo', 'fecha', 'fecha_operacion', 'simplificada', 'forma_pago', 'observaciones',
    'base_imponible', 'cuota_iva', 'cuota_recargo', 'porcentaje_retencion', 'cuota_retencion', 'total'],
  emisor: ['nombre', 'nif', 'direccion', 'codigo_postal', 'municipio', 'provincia', 'pais', 'correo', 'logo'],
  cliente: ['nombre', 'documento', 'direccion', 'codigo_postal', 'municipio', 'poblacion', 'provincia', 'pais', 'codigo'],
  programa: ['nombre', 'version'],
};
const LISTAS = CONFIG.listas || {   // listas que se repiten (cuerpo o tabla con datos="...")
  lineas: ['descripcion', 'cantidad', 'unidad', 'precio', 'porcentaje_descuento', 'importe', 'porcentaje_iva', 'comentario'],
  impuestos: ['tipo_iva', 'base_imponible', 'porcentaje_iva', 'cuota_iva', 'porcentaje_recargo', 'cuota_recargo'],
};
const TODOS_LOS_CAMPOS = Object.entries(CAMPOS).flatMap(([g, cs]) => cs.map((c) => g + '.' + c));

function columnasPorDefecto() {
  return [
    { campo: 'descripcion', titulo: 'Descripción', ancho: 44, alinear: 'izquierda', formato: '' },
    { campo: 'cantidad', titulo: 'Cant.', ancho: 9, alinear: 'derecha', formato: '' },
    { campo: 'precio', titulo: 'Precio', ancho: 14, alinear: 'derecha', formato: 'moneda' },
    { campo: 'porcentaje_descuento', titulo: 'Dto. %', ancho: 9, alinear: 'derecha', formato: '' },
    { campo: 'porcentaje_iva', titulo: 'IVA %', ancho: 10, alinear: 'derecha', formato: '' },
    { campo: 'importe', titulo: 'Importe', ancho: 14, alinear: 'derecha', formato: 'moneda' },
  ];
}

function plantillaVacia() {
  return {
    nombre: 'nueva', formato: 'A4', orientacion: 'vertical',
    margen: { superior: 25, inferior: 20, izquierda: 15, derecha: 15 },
    cabAlt: 70, pieAlt: 55, datos: 'lineas',
    columnas: columnasPorDefecto(), elementos: [],
    marca: null,
    prueba: '',                     // JSON de datos de prueba para la vista previa
    paso: 5,
  };
}

function marcaPorDefecto() {
  return { contenido: 'texto', texto: 'BORRADOR', tam: 100, negrita: true, color: '#000000',
    nombre: '', mime: '', datos: '', ancho: 120, giro: 315, opacidad: 0.08 };
}

function el(tipo, x, y, w, h, extra) {
  return Object.assign({ id: nuevoId(), tipo, x, y, w, h, giro: 0 }, extra);
}

/* Tabla libre (cabecera o pie): distinta de la del cuerpo. Altura automática: fila fija por tamaño de letra. */
function tablaNueva(x, y, w) {
  const t = el('tabla', x, y, w, 0, {
    datos: 'impuestos', tam: 8, borde: 0.2, relleno: '#e2e8f0', titulos: true,
    columnas: [
      { campo: 'base_imponible', titulo: 'Base', ancho: 30, alinear: 'derecha', formato: 'moneda' },
      { campo: 'porcentaje_iva', titulo: '% IVA', ancho: 20, alinear: 'derecha', formato: '' },
      { campo: 'cuota_iva', titulo: 'Cuota IVA', ancho: 30, alinear: 'derecha', formato: 'moneda' },
      { campo: 'cuota_recargo', titulo: 'Recargo', ancho: 20, alinear: 'derecha', formato: 'moneda' },
    ],
  });
  ajustarTabla(t);
  return t;
}
function altoFila(t) { return r2(t.tam * 25.4 / 72 * 1.3 + 1.6); }   // mm
function filasMuestra(t) { return t.datos ? 3 : 1; }                  // filas de ejemplo en el editor
function ajustarTabla(t) { t.h = r2(altoFila(t) * ((t.titulos ? 1 : 0) + filasMuestra(t))); }

function plantillaEjemplo() {
  const d = plantillaVacia();
  d.nombre = 'factura';
  d.elementos = [
    el('logo', 15, 10, 40, 20, { nombre: 'logo.png', mime: '', datos: '' }),
    el('texto', 65, 10, 70, 20, { texto: '{{emisor.nombre}}\n{{emisor.nif}}\n{{emisor.direccion}}\n{{emisor.municipio}}', tam: 10, negrita: false, alinear: 'izquierda' }),
    el('texto', 115, 10, 80, 14, { texto: 'Factura {{factura.numero_completo}}\nFecha: {{factura.fecha}}', tam: 11, negrita: true, alinear: 'derecha' }),
    el('texto', 110, 35, 85, 25, { texto: '{{cliente.nombre}}\n{{cliente.documento}}\n{{cliente.direccion}}\n{{cliente.municipio}}', tam: 10, negrita: false, alinear: 'izquierda' }),
    el('linea', 15, 66, 180, 0, { grosor: 0.3 }),
    tablaNueva(15, 246, 100),
    el('texto', 120, 245, 75, 20, { texto: 'Base: {{factura.base_imponible|moneda}}\nIVA: {{factura.cuota_iva|moneda}}\nTOTAL: {{factura.total|moneda}}', tam: 10, negrita: true, alinear: 'derecha' }),
    el('texto', 15, 268, 180, 9, { texto: 'Forma de pago: {{factura.forma_pago}}. {{factura.observaciones}}', tam: 8, negrita: false, alinear: 'izquierda' }),
  ];
  return d;
}

/* ------------------------------------------------------------------ */
/*  Utilidades                                                         */
/* ------------------------------------------------------------------ */
function dims() {
  const [a, b] = FORMATOS[doc.formato] || FORMATOS.A4;
  return doc.orientacion === 'horizontal' ? [b, a] : [a, b];
}
function S() { return MM * zoom; }
function r2(v) { return Math.round(v * 100) / 100; }
function snap(v, paso) {
  const p = paso === undefined ? doc.paso : paso;
  return p > 0 ? r2(Math.round(v / p) * p) : r2(v);
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function num(v) { return String(r2(+v)); }
function porId(id) { return doc.elementos.find((e) => e.id === id); }

/* Giro: grados en sentido horario alrededor del centro de la caja (x, y, w, h). */
function normGiro(v) {
  const g = ((((+v || 0) % 360) + 360) % 360);
  return r2(g);
}
// Rectángulo envolvente (mm) del elemento ya girado.
function cajaGirada(e) {
  const h = e.tipo === 'linea' ? 0 : e.h;
  const th = (e.giro || 0) * Math.PI / 180;
  const ancho = Math.abs(e.w * Math.cos(th)) + Math.abs(h * Math.sin(th));
  const alto = Math.abs(e.w * Math.sin(th)) + Math.abs(h * Math.cos(th));
  const cx = e.x + e.w / 2, cy = e.y + h / 2;
  return { x: cx - ancho / 2, y: cy - alto / 2, w: ancho, h: alto };
}
// Evita que el elemento girado se salga de la página por arriba o por la izquierda.
function dentroDePagina(e) {
  const c = cajaGirada(e);
  if (c.x < 0) e.x = r2(e.x - c.x);
  if (c.y < 0) e.y = r2(e.y - c.y);
}
/* Contenedor: un elemento con `padre` (id de un rectángulo) guarda x, y y giro relativos al rectángulo. */
function padreDe(e) { return e.padre ? porId(e.padre) : null; }
function esHijo(e) { return !!padreDe(e); }
function hijosDe(r) { return doc.elementos.filter((h) => h.padre === r.id); }
// Pasa un elemento de las coordenadas del rectángulo a las de la página (lo desvincula).
function desvincular(e) {
  const p = padreDe(e);
  delete e.padre;
  if (!p) return;
  const th = (p.giro || 0) * Math.PI / 180, c = Math.cos(th), sn = Math.sin(th);
  const hh = e.tipo === 'linea' ? 0 : e.h;
  const lx = e.x + e.w / 2 - p.w / 2, ly = e.y + hh / 2 - p.h / 2;
  const cx = p.x + p.w / 2 + lx * c - ly * sn, cy = p.y + p.h / 2 + lx * sn + ly * c;
  e.giro = normGiro((e.giro || 0) + (p.giro || 0));
  e.x = r2(cx - e.w / 2); e.y = r2(cy - hh / 2);
}
// Inverso: mete un elemento suelto dentro de un rectángulo conservando su posición en la página.
function vincular(e, p) {
  if (e.padre) desvincular(e);
  const th = (p.giro || 0) * Math.PI / 180, c = Math.cos(th), sn = Math.sin(th);
  const hh = e.tipo === 'linea' ? 0 : e.h;
  const dx = e.x + e.w / 2 - (p.x + p.w / 2), dy = e.y + hh / 2 - (p.y + p.h / 2);
  const lx = dx * c + dy * sn, ly = -dx * sn + dy * c;
  e.x = r2(lx + p.w / 2 - e.w / 2); e.y = r2(ly + p.h / 2 - hh / 2);
  e.giro = normGiro((e.giro || 0) - (p.giro || 0));
  e.padre = p.id;
}
function banda(e) {
  const [, H] = dims();
  const centro = e.y + (e.tipo === 'linea' ? 0 : e.h / 2);
  const medio = (doc.cabAlt + (H - doc.pieAlt)) / 2;
  return centro < medio ? 'cabecera' : 'pie';
}
function mensaje(txt, esError) {
  const m = $('#mensaje');
  m.textContent = txt || '';
  m.className = esError ? 'error' : '';
}

/* ------------------------------------------------------------------ */
/*  XML: exportar e importar                                           */
/* ------------------------------------------------------------------ */
function columnaXML(c) {
  return `    <columna campo="${esc(c.campo)}" titulo="${esc(c.titulo)}" ancho="${num(c.ancho)}" alinear="${c.alinear}" formato="${esc(c.formato || '')}"/>\n`;
}

function elementoXML(e) {
  const p = `x="${num(e.x)}" y="${num(e.y)}"${e.giro ? ` giro="${num(e.giro)}"` : ''}`;
  switch (e.tipo) {
    case 'logo': {
      const a = `nombre="${esc(e.nombre || '')}"${e.datos ? ` tipo="${esc(e.mime)}"` : ''} ${p} ancho="${num(e.w)}" alto="${num(e.h)}"`;
      return e.datos ? `    <logo ${a}>${e.datos}</logo>\n` : `    <logo ${a}/>\n`;
    }
    case 'texto':
      return `    <texto ${p} ancho="${num(e.w)}" alto="${num(e.h)}" tam="${num(e.tam)}" negrita="${e.negrita ? 'true' : 'false'}" alinear="${e.alinear}"${e.borde > 0 ? ` borde="${num(e.borde)}"` : ''}${e.relleno ? ` relleno="${esc(e.relleno)}"` : ''}>${esc(e.texto || '')}</texto>\n`;
    case 'linea':
      return `    <linea ${p} largo="${num(e.w)}" grosor="${num(e.grosor)}"/>\n`;
    case 'tabla':
      return `    <tabla ${p} ancho="${num(e.w)}" tam="${num(e.tam)}" datos="${esc(e.datos || '')}" titulos="${e.titulos ? 'true' : 'false'}" borde="${num(e.borde)}" relleno="${esc(e.relleno || '')}">\n`
        + e.columnas.map((c) => '  ' + columnaXML(c)).join('') + '    </tabla>\n';
    case 'rectangulo': {
      const a = `<rectangulo ${p} ancho="${num(e.w)}" alto="${num(e.h)}" grosor="${num(e.grosor)}" relleno="${esc(e.relleno || '')}"`;
      const hs = hijosDe(e);
      if (!hs.length) return `    ${a}/>\n`;
      return `    ${a}>\n` + hs.map((h) => '  ' + elementoXML(h)).join('') + '    </rectangulo>\n';
    }
  }
  return '';
}

// Marca de agua: ocupa toda la página, detrás de todo; lleva un texto o una imagen centrados y girados.
function marcaXML() {
  const k = doc.marca;
  if (!k) return '';
  let x = `  <marca giro="${num(k.giro || 0)}" opacidad="${num(k.opacidad)}">\n`;
  if (k.contenido === 'imagen') {
    const a = `nombre="${esc(k.nombre || '')}"${k.datos ? ` tipo="${esc(k.mime)}"` : ''} ancho="${num(k.ancho)}"`;
    x += k.datos ? `    <logo ${a}>${k.datos}</logo>\n` : `    <logo ${a}/>\n`;
  } else {
    x += `    <texto tam="${num(k.tam)}" negrita="${k.negrita ? 'true' : 'false'}" color="${esc(k.color || '#000000')}">${esc(k.texto || '')}</texto>\n`;
  }
  return x + '  </marca>\n';
}

// Datos de prueba de la vista previa: JSON dentro de un CDATA, para que viajen con la plantilla.
function pruebaXML() {
  if (!doc.prueba) return '';
  return `  <datos_prueba><![CDATA[${doc.prueba.replace(/\]\]>/g, ']]]]><![CDATA[>')}]]></datos_prueba>\n`;
}

function toXML() {
  const m = doc.margen;
  let x = '<?xml version="1.0" encoding="UTF-8"?>\n';
  x += `<plantilla nombre="${esc(doc.nombre)}" version="1">\n`;
  x += `  <pagina formato="${doc.formato}" orientacion="${doc.orientacion}" unidad="mm">\n`;
  x += `    <margen superior="${num(m.superior)}" inferior="${num(m.inferior)}" izquierda="${num(m.izquierda)}" derecha="${num(m.derecha)}"/>\n`;
  x += '  </pagina>\n';
  x += marcaXML();
  x += pruebaXML();
  x += `  <cabecera altura="${num(doc.cabAlt)}">\n`;
  x += doc.elementos.filter((e) => !esHijo(e) && banda(e) === 'cabecera').map(elementoXML).join('');
  x += '  </cabecera>\n';
  x += `  <cuerpo datos="${esc(doc.datos)}">\n`;
  x += doc.columnas.map(columnaXML).join('');
  x += '  </cuerpo>\n';
  x += `  <pie altura="${num(doc.pieAlt)}">\n`;
  x += doc.elementos.filter((e) => !esHijo(e) && banda(e) === 'pie').map(elementoXML).join('');
  x += '  </pie>\n';
  x += '</plantilla>\n';
  return x;
}

function fromXML(texto) {
  const d = new DOMParser().parseFromString(texto, 'application/xml');
  if (d.getElementsByTagName('parsererror').length) throw new Error('El XML está mal formado.');
  const raiz = d.documentElement;
  if (raiz.nodeName !== 'plantilla') throw new Error('El elemento raíz debe ser <plantilla>.');

  const nuevo = plantillaVacia();
  const n = (nodo, a, def) => {
    const v = parseFloat(nodo.getAttribute(a));
    return Number.isFinite(v) ? v : def;
  };
  const s = (nodo, a, def) => (nodo.hasAttribute(a) ? nodo.getAttribute(a) : def);
  const hijo = (nodo, nombre) => Array.from(nodo.children).find((c) => c.nodeName === nombre);

  nuevo.nombre = s(raiz, 'nombre', 'sin-nombre');
  const pg = hijo(raiz, 'pagina');
  if (pg) {
    const f = s(pg, 'formato', 'A4');
    nuevo.formato = FORMATOS[f] ? f : 'A4';
    nuevo.orientacion = s(pg, 'orientacion', 'vertical') === 'horizontal' ? 'horizontal' : 'vertical';
    const mg = hijo(pg, 'margen');
    if (mg) {
      nuevo.margen = {
        superior: n(mg, 'superior', 25), inferior: n(mg, 'inferior', 20),
        izquierda: n(mg, 'izquierda', 15), derecha: n(mg, 'derecha', 15),
      };
    }
  }

  const leerColumnas = (nodo) => Array.from(nodo.children).filter((c) => c.nodeName === 'columna').map((c) => ({
    campo: s(c, 'campo', ''), titulo: s(c, 'titulo', ''), ancho: n(c, 'ancho', 10),
    alinear: ['izquierda', 'centro', 'derecha'].includes(s(c, 'alinear', 'izquierda')) ? s(c, 'alinear', 'izquierda') : 'izquierda',
    formato: s(c, 'formato', ''),
  }));
  const dp = hijo(raiz, 'datos_prueba');
  if (dp) nuevo.prueba = dp.textContent.trim();
  const mk = hijo(raiz, 'marca');
  if (mk) {
    const m = marcaPorDefecto();
    m.giro = normGiro(n(mk, 'giro', 0));
    m.opacidad = Math.min(1, Math.max(0, n(mk, 'opacidad', 0.08)));
    const img = hijo(mk, 'logo');
    const tx = hijo(mk, 'texto');
    if (img) {
      const datos = img.textContent.replace(/\s+/g, '');
      const mime = s(img, 'tipo', '');
      if (datos !== '' && (!TIPOS_IMAGEN.includes(mime) || !/^[A-Za-z0-9+/]+={0,2}$/.test(datos))) {
        throw new Error('La imagen de la marca de agua no es válida (tipo o base64 incorrecto).');
      }
      Object.assign(m, { contenido: 'imagen', nombre: s(img, 'nombre', ''), mime: datos ? mime : '', datos, ancho: Math.max(1, n(img, 'ancho', 120)) });
    } else if (tx) {
      Object.assign(m, { contenido: 'texto', texto: tx.textContent, tam: Math.max(1, n(tx, 'tam', 100)),
        negrita: s(tx, 'negrita', 'true') === 'true', color: s(tx, 'color', '#000000') });
    }
    nuevo.marca = m;
  }

  const leerElementos = (banda) => {
    if (!banda) return;
    const leerUno = (c, padre) => {
      const base = { x: n(c, 'x', 0), y: n(c, 'y', 0) };
      const antes = nuevo.elementos.length;
      if (c.nodeName === 'logo') {
        const datos = c.textContent.replace(/\s+/g, '');
        const mime = s(c, 'tipo', '');
        if (datos !== '' && (!TIPOS_IMAGEN.includes(mime) || !/^[A-Za-z0-9+/]+={0,2}$/.test(datos))) {
          throw new Error('La imagen de un logo no es válida (tipo o base64 incorrecto).');
        }
        nuevo.elementos.push(el('logo', base.x, base.y, n(c, 'ancho', 40), n(c, 'alto', 20), {
          nombre: s(c, 'nombre', s(c, 'src', '')), mime: datos ? mime : '', datos,
        }));
      } else if (c.nodeName === 'texto') {
        nuevo.elementos.push(el('texto', base.x, base.y, n(c, 'ancho', 50), n(c, 'alto', 10), {
          texto: c.textContent, tam: n(c, 'tam', 10), negrita: s(c, 'negrita', 'false') === 'true',
          borde: Math.max(0, n(c, 'borde', 0)), relleno: s(c, 'relleno', ''),
          alinear: ['izquierda', 'centro', 'derecha'].includes(s(c, 'alinear', 'izquierda')) ? s(c, 'alinear', 'izquierda') : 'izquierda',
        }));
      } else if (c.nodeName === 'tabla' && !padre) {
        const t = el('tabla', base.x, base.y, Math.max(5, n(c, 'ancho', 100)), 0, {
          datos: s(c, 'datos', ''), tam: Math.max(1, n(c, 'tam', 9)), borde: Math.max(0, n(c, 'borde', 0.2)),
          relleno: s(c, 'relleno', '#e2e8f0'), titulos: s(c, 'titulos', 'true') !== 'false', columnas: leerColumnas(c),
        });
        ajustarTabla(t);
        nuevo.elementos.push(t);
      } else if (c.nodeName === 'linea') {
        nuevo.elementos.push(el('linea', base.x, base.y, n(c, 'largo', 50), 0, { grosor: n(c, 'grosor', 0.3) }));
      } else if (c.nodeName === 'rectangulo') {
        nuevo.elementos.push(el('rectangulo', base.x, base.y, n(c, 'ancho', 40), n(c, 'alto', 20), {
          grosor: n(c, 'grosor', 0.3), relleno: s(c, 'relleno', ''),
        }));
      }
      if (nuevo.elementos.length > antes) {
        const nuevoEl = nuevo.elementos[antes];
        nuevoEl.giro = normGiro(n(c, 'giro', 0));
        if (padre) nuevoEl.padre = padre.id;
        else if (c.nodeName === 'rectangulo') {
          for (const h of Array.from(c.children)) if (['logo', 'texto', 'linea'].includes(h.nodeName)) leerUno(h, nuevoEl);
        }
      }
    };
    for (const c of Array.from(banda.children)) leerUno(c, null);
  };

  const cab = hijo(raiz, 'cabecera');
  const pie = hijo(raiz, 'pie');
  if (cab) nuevo.cabAlt = n(cab, 'altura', nuevo.cabAlt);
  if (pie) nuevo.pieAlt = n(pie, 'altura', nuevo.pieAlt);
  leerElementos(cab);
  const cu = hijo(raiz, 'cuerpo');
  if (cu) {
    nuevo.datos = s(cu, 'datos', 'lineas');
    const cols = leerColumnas(cu);
    if (cols.length) nuevo.columnas = cols;
  }
  leerElementos(pie);
  return nuevo;
}

/* ------------------------------------------------------------------ */
/*  Historial y borrador                                               */
/* ------------------------------------------------------------------ */
let hist = [];
let hi = -1;
let temporizador = null;

function commit() {
  const s = JSON.stringify(doc);
  if (hist[hi] === s) return;
  hist = hist.slice(0, hi + 1);
  hist.push(s);
  if (hist.length > 100) hist.shift();
  // Con imágenes en base64 cada instantánea pesa; se limita la memoria del historial.
  while (hist.length > 1 && hist.reduce((a, x) => a + x.length, 0) > 20e6) hist.shift();
  hi = hist.length - 1;
  refrescarXML();
  guardarSesion();
  actualizarEstado();
}
function commitDiferido() {
  clearTimeout(temporizador);
  temporizador = setTimeout(commit, 350);
}
function reiniciarHistorial() {
  clearTimeout(temporizador);
  hist = []; hi = -1;
}
function guardarSesion() {
  try {
    localStorage.setItem(CLAVE_LS, JSON.stringify({ xml: toXML(), origen, guardado: guardadoXml }));
  } catch (e) { /* sin almacenamiento */ }
}
function sucio() { return toXML() !== guardadoXml; }
function esOrigen(nombre) {
  return !!origen && origen.nombre.toLowerCase() === String(nombre).trim().toLowerCase();
}
function actualizarEstado() {
  const e = $('#p-estado');
  let t;
  let marca = false;
  if (!servidor) {
    t = `${doc.nombre} · modo local (sin servidor)`;
  } else if (!esOrigen(doc.nombre)) {
    t = `${doc.nombre} · sin guardar`; marca = true;
  } else if (sucio()) {
    t = `${doc.nombre} · v${origen.version} · cambios sin guardar`; marca = true;
  } else {
    t = `${doc.nombre} · v${origen.version} · guardada`;
  }
  e.textContent = t;
  e.className = marca ? 'sucio' : '';
  document.title = (marca ? '● ' : '') + doc.nombre + ' — Editor de plantillas';
  $('#b-guardar').disabled = !servidor;
  $('#b-guardar-como').disabled = !servidor;
  $('#b-plantillas').disabled = !servidor;
  const ayuda = servidor ? '' : ' (requiere el servidor: php -S localhost:8000 -t public router.php)';
  $('#b-guardar').title = 'Guardar en el servidor (Ctrl+S)' + ayuda;
  $('#b-plantillas').title = 'Plantillas guardadas en el servidor' + ayuda;
}
function deshacer() {
  clearTimeout(temporizador); commit();
  if (hi > 0) { hi--; doc = JSON.parse(hist[hi]); sel = null; todo(); refrescarXML(); guardarSesion(); actualizarEstado(); }
}
function rehacer() {
  if (hi < hist.length - 1) { hi++; doc = JSON.parse(hist[hi]); sel = null; todo(); refrescarXML(); guardarSesion(); actualizarEstado(); }
}

/* ------------------------------------------------------------------ */
/*  Dibujo del lienzo                                                  */
/* ------------------------------------------------------------------ */
function div(clase, estilo) {
  const d = document.createElement('div');
  if (clase) d.className = clase;
  if (estilo) Object.assign(d.style, estilo);
  return d;
}
const px = (mm) => (mm * S()) + 'px';

function render() {
  const [W, H] = dims();
  const s = S();
  pagina.innerHTML = '';
  pagina.style.width = px(W);
  pagina.style.height = px(H);
  const r = 0.35 * s;
  pagina.style.backgroundImage = `radial-gradient(circle, #8a8f98 ${r}px, transparent ${r + 0.7}px)`;
  pagina.style.backgroundSize = `${5 * s}px ${5 * s}px`;
  pagina.style.backgroundPosition = `${-2.5 * s}px ${-2.5 * s}px`;

  if (doc.marca) pagina.appendChild(dibujarMarca(doc.marca, W, H));

  const m = doc.margen;
  pagina.appendChild(div('guia-margen', {
    left: px(m.izquierda), top: px(m.superior),
    width: px(W - m.izquierda - m.derecha), height: px(H - m.superior - m.inferior),
  }));

  // Zona del cuerpo
  const cTop = doc.cabAlt, cAlt = Math.max(0, H - doc.pieAlt - doc.cabAlt);
  const zona = div('cuerpo-zona' + (sel === 'cuerpo' ? ' sel' : ''), {
    left: px(m.izquierda), top: px(cTop), width: px(W - m.izquierda - m.derecha), height: px(cAlt),
  });
  zona.dataset.cuerpo = '1';
  const fs = (9 * PT * s) + 'px';
  const tabla = document.createElement('table');
  tabla.style.fontSize = fs;
  const cg = document.createElement('colgroup');
  const total = doc.columnas.reduce((a, c) => a + (+c.ancho || 0), 0) || 1;
  doc.columnas.forEach((c) => {
    const col = document.createElement('col');
    col.style.width = ((+c.ancho || 0) / total * 100) + '%';
    cg.appendChild(col);
  });
  tabla.appendChild(cg);
  const th = tabla.createTHead().insertRow();
  doc.columnas.forEach((c) => {
    const t = document.createElement('th');
    t.textContent = c.titulo; t.style.textAlign = alineacion(c.alinear);
    th.appendChild(t);
  });
  const tb = tabla.createTBody();
  for (let i = 0; i < 3; i++) {
    const fila = tb.insertRow();
    doc.columnas.forEach((c) => {
      const t = fila.insertCell();
      t.textContent = '{' + c.campo + '}'; t.style.textAlign = alineacion(c.alinear);
    });
  }
  zona.appendChild(tabla);
  pagina.appendChild(zona);

  // Guías de banda
  const g1 = div('guia-banda', { top: px(doc.cabAlt) });
  g1.innerHTML = '<span>Cabecera ↑ · Cuerpo ↓</span>';
  const g2 = div('guia-banda', { top: px(H - doc.pieAlt) });
  g2.innerHTML = '<span>Cuerpo ↑ · Pie ↓</span>';
  pagina.append(g1, g2);

  // Elementos
  doc.elementos.filter((e) => !esHijo(e)).forEach((e) => pagina.appendChild(dibujarElemento(e)));
}

function dibujarMarca(k, W, H, s = S(), seleccionada = sel === 'marca') {
  const pxl = (mm) => (mm * s) + 'px';
  const caja = div('marca' + (seleccionada ? ' sel' : ''), { width: pxl(W), height: pxl(H) });
  const centro = div('marca-centro', { opacity: String(k.opacidad), transform: `rotate(${k.giro || 0}deg)` });
  if (k.contenido === 'imagen') {
    const url = k.datos ? urlImagen(k) : '';
    if (url) {
      const img = document.createElement('img');
      img.src = url; img.draggable = false; img.style.width = pxl(k.ancho);
      centro.appendChild(img);
    } else {
      centro.textContent = 'IMAGEN';
      centro.style.fontSize = pxl(30);
    }
  } else {
    centro.textContent = k.texto;
    centro.style.fontSize = (k.tam * PT * s) + 'px';
    centro.style.fontWeight = k.negrita ? '700' : '400';
    centro.style.color = k.color || '#000';
  }
  caja.appendChild(centro);
  return caja;
}

function alineacion(a) { return a === 'centro' ? 'center' : a === 'derecha' ? 'right' : 'left'; }

// URL de blob para mostrar la imagen base64 de un logo (con caché por contenido).
function urlImagen(e) {
  let u = urlsImagen.get(e.datos);
  if (u === undefined) {
    try {
      const bin = atob(e.datos);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      u = URL.createObjectURL(new Blob([bytes], { type: e.mime }));
    } catch (err) {
      u = '';
    }
    urlsImagen.set(e.datos, u);
  }
  return u;
}

function tablaDOM(e, s) {
  const tabla = document.createElement('table');
  tabla.className = 'tabla-libre';
  tabla.style.fontSize = (e.tam * PT * s) + 'px';
  const cg = document.createElement('colgroup');
  const total = e.columnas.reduce((a, c) => a + (+c.ancho || 0), 0) || 1;
  e.columnas.forEach((c) => {
    const col = document.createElement('col');
    col.style.width = ((+c.ancho || 0) / total * 100) + '%';
    cg.appendChild(col);
  });
  tabla.appendChild(cg);
  const linea = e.borde > 0 ? Math.max(1, e.borde * s) + 'px solid #000' : 'none';
  const estilo = (celda, c) => {
    celda.style.textAlign = alineacion(c.alinear);
    celda.style.border = linea;
    celda.style.height = (altoFila(e) * s) + 'px';
  };
  if (e.titulos) {
    const fh = tabla.createTHead().insertRow();
    e.columnas.forEach((c) => {
      const th = document.createElement('th');
      th.textContent = c.titulo; estilo(th, c);
      if (e.relleno) th.style.background = e.relleno;
      fh.appendChild(th);
    });
  }
  const tb = tabla.createTBody();
  for (let i = 0; i < filasMuestra(e); i++) {
    const fila = tb.insertRow();
    e.columnas.forEach((c) => {
      const td = fila.insertCell();
      td.textContent = '{' + c.campo + '}'; estilo(td, c);
    });
  }
  return tabla;
}

function dibujarElemento(e) {
  const s = S();
  const esSel = sel === e.id;
  let caja;
  if (e.tipo === 'linea') {
    const alto = Math.max(2.5, e.grosor + 1.5);
    caja = div('el linea' + (esSel ? ' sel' : ''), { left: px(e.x), top: px(e.y - alto / 2), width: px(e.w), height: px(alto) });
    caja.appendChild(div('trazo', { height: Math.max(1, e.grosor * s) + 'px', marginTop: -Math.max(1, e.grosor * s) / 2 + 'px' }));
  } else {
    caja = div('el ' + e.tipo + (esSel ? ' sel' : ''), { left: px(e.x), top: px(e.y), width: px(e.w), height: px(e.h) });
    const c = div('contenido');
    if (e.tipo === 'texto') {
      c.textContent = e.texto;
      c.style.fontSize = (e.tam * PT * s) + 'px';
      c.style.fontWeight = e.negrita ? '700' : '400';
      c.style.textAlign = alineacion(e.alinear);
      c.style.lineHeight = '1.2';
      if (e.borde > 0) c.style.border = Math.max(1, e.borde * s) + 'px solid #000';
      if (e.relleno) c.style.background = e.relleno;
      if (e.borde > 0 || e.relleno) c.style.padding = (1 * s) + 'px';
    } else if (e.tipo === 'logo') {
      const url = e.datos ? urlImagen(e) : '';
      if (url) {
        const img = document.createElement('img');
        img.src = url; img.draggable = false;
        c.appendChild(img);
      } else {
        c.textContent = 'LOGO\n' + (e.nombre || '(sin imagen)');
      }
    } else if (e.tipo === 'tabla') {
      c.style.overflow = 'hidden';
      c.appendChild(tablaDOM(e, s));
    } else if (e.tipo === 'rectangulo') {
      c.style.border = Math.max(1, e.grosor * s) + 'px solid #000';
      if (e.relleno) c.style.background = e.relleno;
    }
    caja.appendChild(c);
    if (e.tipo === 'rectangulo') hijosDe(e).forEach((h) => caja.appendChild(dibujarElemento(h)));
  }
  caja.dataset.id = e.id;
  if (e.giro) caja.style.transform = `rotate(${e.giro}deg)`;
  if (esSel) {
    const asa = div('asa');
    asa.dataset.asa = '1';
    const rot = div('rot');
    rot.dataset.rot = '1';
    rot.title = 'Girar (pasos de 15°; Alt: 1°)';
    caja.append(asa, rot);
  }
  return caja;
}

/* ------------------------------------------------------------------ */
/*  Interacción: seleccionar, mover, redimensionar                     */
/* ------------------------------------------------------------------ */
function seleccionar(id) {
  const cambio = sel !== id;
  sel = id;
  render();
  if (cambio) panelElemento();
}

pagina.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  const asa = ev.target.closest('[data-asa]');
  const rot = ev.target.closest('[data-rot]');
  const caja = ev.target.closest('.el');
  if (caja) {
    const e = porId(caja.dataset.id);
    if (!e) return;
    iniciarDrag(ev, e, rot ? 'giro' : asa ? 'tamano' : 'mover');
  } else if (ev.target.closest('[data-cuerpo]')) {
    seleccionar('cuerpo');
  } else {
    seleccionar(null);
  }
});

function iniciarDrag(ev, e, modo) {
  ev.preventDefault();
  seleccionar(e.id);
  drag = { id: e.id, modo, sx: ev.clientX, sy: ev.clientY, ox: e.x, oy: e.y, ow: e.w, oh: e.h, og: e.giro || 0, pg: (padreDe(e) || {}).giro || 0, hijo: esHijo(e), movido: false };
  window.addEventListener('pointermove', moverDrag);
  window.addEventListener('pointerup', terminarDrag);
}
function moverDrag(ev) {
  if (!drag) return;
  const e = porId(drag.id);
  if (!e) return;
  const s = S();
  const dx = (ev.clientX - drag.sx) / s, dy = (ev.clientY - drag.sy) / s;
  if (!drag.movido && Math.hypot(dx, dy) * s < 3) return;
  drag.movido = true;
  const paso = ev.altKey ? 0.5 : doc.paso;     // Alt: ajuste fino
  // Si está dentro de un rectángulo, el movimiento se pasa a los ejes del rectángulo (que puede estar girado).
  const thP = drag.pg * Math.PI / 180;
  const ddx = drag.hijo ? dx * Math.cos(thP) + dy * Math.sin(thP) : dx;
  const ddy = drag.hijo ? -dx * Math.sin(thP) + dy * Math.cos(thP) : dy;
  if (drag.modo === 'mover') {
    e.x = snap(drag.ox + ddx, paso);
    e.y = snap(drag.oy + ddy, paso);
    if (!drag.hijo) dentroDePagina(e);
  } else if (drag.modo === 'giro') {
    const caja = pagina.querySelector(`[data-id="${e.id}"]`);
    if (!caja) return;
    const r = caja.getBoundingClientRect();     // el centro de la caja girada es su centro de giro
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    // El asa está encima del centro (ángulo -90°), así que 0° de giro = +90° del puntero.
    const grados = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI + 90;
    const pasoAng = ev.altKey ? 1 : 15;
    e.giro = normGiro(Math.round(grados / pasoAng) * pasoAng - drag.pg);
    if (!drag.hijo) dentroDePagina(e);
  } else {
    // Redimensionar en los ejes del elemento (girado), dejando fija su esquina superior izquierda.
    const thT = (drag.og + drag.pg) * Math.PI / 180;
    const ldx = dx * Math.cos(thT) + dy * Math.sin(thT), ldy = -dx * Math.sin(thT) + dy * Math.cos(thT);
    const th = drag.og * Math.PI / 180, cos = Math.cos(th), sin = Math.sin(th);
    const girar = (a, b) => [a * cos - b * sin, a * sin + b * cos];
    const minimo = paso > 0 ? paso : 1;
    const w = Math.max(minimo, snap(drag.ow + ldx, paso));
    const h = e.tipo === 'linea' ? 0 : e.tipo === 'tabla' ? drag.oh : Math.max(minimo, snap(drag.oh + ldy, paso));
    const [ax, ay] = girar(-drag.ow / 2, -drag.oh / 2);
    const esqX = drag.ox + drag.ow / 2 + ax, esqY = drag.oy + drag.oh / 2 + ay;
    const [bx, by] = girar(w / 2, h / 2);
    e.w = w;
    if (e.tipo !== 'linea' && e.tipo !== 'tabla') e.h = h;
    e.x = r2(esqX + bx - w / 2);
    e.y = r2(esqY + by - h / 2);
    if (!drag.hijo) dentroDePagina(e);
  }
  render();
  sincronizarGeometria(e);
}
function terminarDrag() {
  window.removeEventListener('pointermove', moverDrag);
  window.removeEventListener('pointerup', terminarDrag);
  if (drag && drag.movido) commit();
  drag = null;
}
function sincronizarGeometria(e) {
  for (const k of ['x', 'y', 'w', 'h', 'giro']) if (refs[k]) refs[k].value = e[k] || 0;
}

pagina.addEventListener('pointermove', (ev) => {
  const r = pagina.getBoundingClientRect();
  const x = (ev.clientX - r.left) / S(), y = (ev.clientY - r.top) / S();
  $('#coords').textContent = `x: ${x.toFixed(1)} mm   y: ${y.toFixed(1)} mm`;
});

window.addEventListener('keydown', (ev) => {
  const ctrl = ev.ctrlKey || ev.metaKey;
  if (ctrl && ev.key.toLowerCase() === 's') { ev.preventDefault(); if (!$('#lista').open && !$('#previa').open) (ev.shiftKey ? guardarComo() : guardar()); return; }
  if ($('#lista').open || $('#previa').open) return;
  const t = ev.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  if (ctrl && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? rehacer() : deshacer(); return; }
  if (ctrl && ev.key.toLowerCase() === 'y') { ev.preventDefault(); rehacer(); return; }
  if (ctrl && ev.key.toLowerCase() === 'd') { ev.preventDefault(); duplicar(); return; }
  if (sel === 'marca' && (ev.key === 'Delete' || ev.key === 'Backspace')) { ev.preventDefault(); eliminar(); return; }
  const e = sel && sel !== 'cuerpo' ? porId(sel) : null;
  if (!e) return;
  if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); eliminar(); return; }
  const mov = ev.shiftKey ? 5 : 1;
  const d = { ArrowLeft: [-mov, 0], ArrowRight: [mov, 0], ArrowUp: [0, -mov], ArrowDown: [0, mov] }[ev.key];
  if (d) {
    ev.preventDefault();
    e.x = r2(e.x + d[0]); e.y = r2(e.y + d[1]);
    if (!esHijo(e)) dentroDePagina(e);
    render(); sincronizarGeometria(e); commitDiferido();
  }
});

/*  Acciones                                                           */
/* ------------------------------------------------------------------ */
function anadir(tipo) {
  const m = doc.margen;
  const x = snap(m.izquierda + 10), y = snap(m.superior + 10);
  // Con un rectángulo seleccionado (o un elemento de su interior), lo nuevo se añade dentro.
  const actual = sel && sel !== 'cuerpo' && sel !== 'marca' ? porId(sel) : null;
  const cont = actual ? (actual.tipo === 'rectangulo' ? actual : padreDe(actual)) : null;
  let e;
  if (cont && tipo !== 'rectangulo' && tipo !== 'tabla') {
    const mg = Math.min(2, cont.w / 4, cont.h / 4);
    const iw = Math.max(5, r2(cont.w - 2 * mg)), ih = Math.max(3, r2(cont.h - 2 * mg));
    if (tipo === 'logo') e = el('logo', mg, mg, Math.min(40, iw), Math.min(20, ih), { nombre: '', mime: '', datos: '' });
    else if (tipo === 'texto') e = el('texto', mg, mg, iw, Math.min(10, ih), { texto: 'Texto {{campo}}', tam: 10, negrita: false, alinear: 'izquierda', borde: 0, relleno: '' });
    else e = el('linea', mg, r2(cont.h / 2), iw, 0, { grosor: 0.3 });
    e.padre = cont.id;
    doc.elementos.push(e);
    seleccionar(e.id);
    commit();
    return;
  }
  if (tipo === 'tabla') e = tablaNueva(snap(m.izquierda), snap(dims()[1] - doc.pieAlt + 5), 100);
  else if (tipo === 'logo') e = el('logo', x, y, 40, 20, { nombre: '', mime: '', datos: '' });
  else if (tipo === 'texto') e = el('texto', x, y, 60, 10, { texto: 'Texto {{campo}}', tam: 10, negrita: false, alinear: 'izquierda', borde: 0, relleno: '' });
  else if (tipo === 'linea') e = el('linea', x, y, 80, 0, { grosor: 0.3 });
  else e = el('rectangulo', x, y, 50, 15, { grosor: 0.3, relleno: '' });
  doc.elementos.push(e);
  seleccionar(e.id);
  commit();
}
function duplicar() {
  const e = sel && sel !== 'cuerpo' ? porId(sel) : null;
  if (!e) return;
  const c = JSON.parse(JSON.stringify(e));
  c.id = nuevoId(); c.x = r2(c.x + 5); c.y = r2(c.y + 5);
  doc.elementos.push(c);
  if (e.tipo === 'rectangulo') {
    hijosDe(e).forEach((h) => {
      const hc = JSON.parse(JSON.stringify(h));
      hc.id = nuevoId(); hc.padre = c.id;     // el contenido va con el rectángulo copiado
      doc.elementos.push(hc);
    });
  }
  seleccionar(c.id);
  commit();
}
function eliminar() {
  if (sel === 'marca') { doc.marca = null; sel = null; todo(); commit(); return; }
  const e = sel && sel !== 'cuerpo' ? porId(sel) : null;
  if (!e) return;
  if (e.tipo === 'rectangulo') hijosDe(e).forEach(desvincular);   // el contenido no se borra: queda suelto
  doc.elementos = doc.elementos.filter((x) => x.id !== e.id);
  sel = null;
  todo();
  commit();
}

document.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => anadir(b.dataset.add)));
$('#b-marca').addEventListener('click', () => {
  if (!doc.marca) doc.marca = marcaPorDefecto();
  seleccionar('marca');
  commit();
});
$('#b-duplicar').addEventListener('click', duplicar);
$('#b-eliminar').addEventListener('click', eliminar);
$('#b-deshacer').addEventListener('click', deshacer);
$('#b-rehacer').addEventListener('click', rehacer);
$('#zoom').addEventListener('change', (ev) => { zoom = parseFloat(ev.target.value); render(); });
// Empieza a editar otra plantilla. `o` = {nombre, version} si viene del servidor.
function empezar(d, o) {
  doc = d; sel = null; origen = o || null;
  guardadoXml = o ? toXML() : '';
  reiniciarHistorial();
  todo();
  commit();
}
function descartar(msg) { return !sucio() || confirm(msg); }
function nueva() {
  if (!descartar('Hay cambios sin guardar. ¿Descartarlos y empezar una plantilla vacía?')) return false;
  empezar(plantillaVacia());
  return true;
}
function ejemplo() {
  if (!descartar('Hay cambios sin guardar. ¿Descartarlos y cargar el ejemplo de factura?')) return false;
  empezar(plantillaEjemplo());
  return true;
}
$('#b-nueva').addEventListener('click', nueva);
$('#b-ejemplo').addEventListener('click', ejemplo);
$('#b-guardar').addEventListener('click', guardar);
$('#b-guardar-como').addEventListener('click', guardarComo);
$('#b-plantillas').addEventListener('click', abrirLista);
$('#b-exportar').addEventListener('click', () => {
  const blob = new Blob([toXML()], { type: 'application/xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (doc.nombre || 'plantilla').replace(/[^\w.-]+/g, '_') + '.xml';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  mensaje('XML exportado.');
});
$('#b-importar').addEventListener('click', () => $('#f-importar').click());
$('#f-importar').addEventListener('change', (ev) => {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  const lector = new FileReader();
  lector.onload = () => aplicarXML(String(lector.result));
  lector.readAsText(f);
});

function aplicarXML(texto) {
  try {
    doc = fromXML(texto);
    sel = null;
    todo();
    commit();
    mensaje('XML cargado.');
    return true;
  } catch (err) {
    mensaje(err.message, true);
    return false;
  }
}

/* ------------------------------------------------------------------ */
/*  Panel de propiedades                                               */
/* ------------------------------------------------------------------ */
function campo(etiqueta, tipo, valor, alCambiar, opciones) {
  const l = document.createElement('label');
  l.className = 'campo';
  l.append(etiqueta);
  let inp;
  if (tipo === 'select') {
    inp = document.createElement('select');
    opciones.forEach(([v, t]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = t; inp.appendChild(o);
    });
    inp.value = String(valor);
  } else if (tipo === 'textarea') {
    inp = document.createElement('textarea');
    inp.rows = 4; inp.value = valor;
  } else {
    inp = document.createElement('input');
    inp.type = tipo; inp.value = valor;
    if (tipo === 'number') inp.step = 'any';
  }
  inp.addEventListener('input', () => {
    alCambiar(tipo === 'number' ? (inp.value === '' ? 0 : parseFloat(inp.value)) : inp.value);
    render(); commitDiferido();
  });
  l.appendChild(inp);
  l._inp = inp;
  return l;
}
function fila(...hijos) {
  const f = document.createElement('div');
  f.className = 'fila' + (hijos.length === 1 ? ' una' : hijos.length === 4 ? ' cuatro' : '');
  hijos.forEach((h) => f.appendChild(h));
  return f;
}
function seccion(titulo) {
  const h = document.createElement('h2');
  h.textContent = titulo;
  return h;
}
function nota(txt, clase) {
  const p = document.createElement('p');
  p.className = clase || 'ayuda'; p.textContent = txt;
  return p;
}

// Desplegable que inserta {{grupo.campo}} en la posición del cursor de un textarea.
function selectorCampos(ta) {
  const l = document.createElement('label');
  l.className = 'campo';
  l.append('Insertar campo');
  const sl = document.createElement('select');
  const vacio = document.createElement('option');
  vacio.value = ''; vacio.textContent = 'Elegir campo…';
  sl.appendChild(vacio);
  for (const [g, cs] of Object.entries(CAMPOS)) {
    const og = document.createElement('optgroup');
    og.label = g;
    cs.forEach((c) => { const o = document.createElement('option'); o.value = g + '.' + c; o.textContent = c; og.appendChild(o); });
    sl.appendChild(og);
  }
  sl.addEventListener('change', () => {
    if (!sl.value) return;
    const ins = '{{' + sl.value + '}}';
    const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
    ta.value = ta.value.slice(0, a) + ins + ta.value.slice(b);
    ta.setSelectionRange(a + ins.length, a + ins.length);
    ta.dispatchEvent(new Event('input'));
    sl.value = '';
  });
  l.appendChild(sl);
  return l;
}

function panelPlantilla(destino) {
  const m = doc.margen;
  destino.appendChild(seccion('Plantilla'));
  destino.appendChild(fila(campo('Nombre', 'text', doc.nombre, (v) => { doc.nombre = v; })));
  destino.appendChild(fila(
    campo('Formato', 'select', doc.formato, (v) => { doc.formato = v; }, Object.keys(FORMATOS).map((k) => [k, k])),
    campo('Orientación', 'select', doc.orientacion, (v) => { doc.orientacion = v; }, [['vertical', 'Vertical'], ['horizontal', 'Horizontal']]),
  ));
  destino.appendChild(fila(
    campo('Margen sup. (mm)', 'number', m.superior, (v) => { m.superior = v; }),
    campo('Margen inf. (mm)', 'number', m.inferior, (v) => { m.inferior = v; }),
  ));
  destino.appendChild(fila(
    campo('Margen izq. (mm)', 'number', m.izquierda, (v) => { m.izquierda = v; }),
    campo('Margen der. (mm)', 'number', m.derecha, (v) => { m.derecha = v; }),
  ));
  destino.appendChild(fila(
    campo('Altura cabecera (mm)', 'number', doc.cabAlt, (v) => { doc.cabAlt = v; }),
    campo('Altura pie (mm)', 'number', doc.pieAlt, (v) => { doc.pieAlt = v; }),
  ));
  destino.appendChild(fila(campo('Imán a la rejilla', 'select', doc.paso, (v) => { doc.paso = parseFloat(v); },
    [['5', '5 mm'], ['1', '1 mm'], ['0.5', '0,5 mm'], ['0', 'Sin imán']])));
  destino.appendChild(nota('Alt al arrastrar: ajuste fino de 0,5 mm. Flechas: 1 mm (Mayús: 5 mm).'));
}

// Editor de columnas (cuerpo y tablas libres): campo, título, ancho, alineación, formato; reordenar con el asa.
function panelColumnas(cols, lista) {
  const suma = cols.reduce((a, c) => a + (+c.ancho || 0), 0);
  panel.appendChild(nota(r2(suma) === 100 ? 'Anchos: suman 100 %.' : `Anchos: suman ${r2(suma)} %, deberían sumar 100.`, r2(suma) === 100 ? 'ayuda' : 'aviso'));
  const contCols = document.createElement('div');
  cols.forEach((c, i) => {
    const caja = document.createElement('div');
    caja.className = 'col';
    caja.dataset.i = i;
    const cab = document.createElement('div');
    cab.className = 'col-cab';
    const grip = document.createElement('span');
    grip.className = 'grip';
    grip.title = 'Arrastra para cambiar el orden';
    grip.addEventListener('pointerdown', (ev) => iniciarOrden(ev, contCols, caja, cols));
    const nombreCol = document.createElement('strong');
    nombreCol.textContent = c.titulo || '(sin título)';
    cab.append(grip, nombreCol);
    caja.appendChild(cab);
    const gc = campo('Campo', 'text', c.campo, (v) => { c.campo = v; });
    if (lista) gc._inp.setAttribute('list', lista);
    caja.appendChild(fila(
      gc,
      campo('Título', 'text', c.titulo, (v) => { c.titulo = v; nombreCol.textContent = v || '(sin título)'; }),
    ));
    caja.appendChild(fila(
      campo('Ancho %', 'number', c.ancho, (v) => { c.ancho = v; }),
      campo('Alinear', 'select', c.alinear, (v) => { c.alinear = v; }, [['izquierda', 'Izquierda'], ['centro', 'Centro'], ['derecha', 'Derecha']]),
    ));
    caja.appendChild(fila(campo('Formato', 'select', c.formato || '', (v) => { c.formato = v; },
      [['', 'Ninguno'], ['moneda', 'Moneda'], ['numero', 'Número'], ['fecha', 'Fecha']])));
    const q = document.createElement('button');
    q.textContent = 'Quitar columna'; q.className = 'peligro';
    q.addEventListener('click', () => { cols.splice(i, 1); panelElemento(); render(); commit(); });
    caja.appendChild(q);
    contCols.appendChild(caja);
  });
  panel.appendChild(contCols);
  const a = document.createElement('button');
  a.textContent = '+ Añadir columna';
  a.addEventListener('click', () => {
    cols.push({ campo: 'campo', titulo: 'Título', ancho: 10, alinear: 'izquierda', formato: '' });
    panelElemento(); render(); commit();
  });

// Reordenar columnas arrastrando el asa de dos líneas.
function iniciarOrden(ev, cont, caja, cols) {
  if (ev.button !== undefined && ev.button !== 0) return;
  ev.preventDefault();
  caja.classList.add('arrastrando');
  document.body.classList.add('ordenando');
  const mover = (e) => {
    const pr = panel.getBoundingClientRect();
    if (e.clientY < pr.top + 30) panel.scrollTop -= 12;
    else if (e.clientY > pr.bottom - 30) panel.scrollTop += 12;
    const otras = Array.from(cont.children).filter((c) => c !== caja);
    let destino = null;
    for (const c of otras) {
      const r = c.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { destino = c; break; }
    }
    if (destino !== caja.nextElementSibling) cont.insertBefore(caja, destino);
  };
  const fin = () => {
    window.removeEventListener('pointermove', mover);
    window.removeEventListener('pointerup', fin);
    window.removeEventListener('pointercancel', fin);
    caja.classList.remove('arrastrando');
    document.body.classList.remove('ordenando');
    const orden = Array.from(cont.children).map((c) => +c.dataset.i);
    if (orden.some((v, i) => v !== i)) {
      const copia = orden.map((i) => cols[i]);
      cols.splice(0, cols.length, ...copia);
      if (sel && sel !== 'cuerpo') { const t = porId(sel); if (t) ajustarTabla(t); }
      panelElemento();
      render();
      commit();
    }
  };
  window.addEventListener('pointermove', mover);
  window.addEventListener('pointerup', fin);
  window.addEventListener('pointercancel', fin);
}

  };
  lector.readAsDataURL(f);
});

function rutaDe(obj, r) {
  return String(r).split('.').reduce((o, k) => (o !== null && typeof o === 'object' ? o[k] : undefined), obj);
}
function formatear(v, f) {
  if (v === undefined || v === null) return '';
  if (typeof v === 'boolean') return v ? 'sí' : 'no';
  const n = typeof v === 'number' ? v : parseFloat(v);
  if (f === 'moneda') return Number.isFinite(n) ? n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' }) : String(v);
  if (f === 'numero') return Number.isFinite(n) ? n.toLocaleString('es-ES', { maximumFractionDigits: 4 }) : String(v);
  if (f === 'fecha') { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v)); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v); }
  return String(v);
}
// Sustituye {{ruta}} y {{ruta|formato}}; lo que no existe queda resaltado y se anota en `avisos`.
function rellenar(texto, datos, avisos) {
  const frag = document.createDocumentFragment();
  const re = /\{\{\s*([\w.]+)\s*(?:\|\s*(\w+)\s*)?\}\}/g;
  let ult = 0, m;
  while ((m = re.exec(texto))) {
    frag.append(texto.slice(ult, m.index));
    const v = rutaDe(datos, m[1]);
    if (v === undefined || (v !== null && typeof v === 'object')) {
      avisos.add(m[1]);
      const sp = document.createElement('span');
      sp.className = 'falta'; sp.textContent = m[0];
      frag.append(sp);
    } else {
      frag.append(formatear(v, m[2]));
    }
    ult = m.index + m[0].length;
  }
  frag.append(texto.slice(ult));
  return frag;
}

function previaTabla(e, datos, sc, avisos) {
  const pv = (mm) => (mm * sc) + 'px';
  const t = document.createElement('table');
  t.className = 'pv-tabla';
  t.style.left = pv(0); t.style.top = pv(0); t.style.width = pv(e.w);
  t.style.fontSize = (e.tam * PT * sc) + 'px';
  const cg = document.createElement('colgroup');
  const total = e.columnas.reduce((a, c) => a + (+c.ancho || 0), 0) || 1;
  e.columnas.forEach((c) => { const col = document.createElement('col'); col.style.width = ((+c.ancho || 0) / total * 100) + '%'; cg.appendChild(col); });
  t.appendChild(cg);
  const linea = e.borde > 0 ? Math.max(1, e.borde * sc) + 'px solid #000' : 'none';
  const celda = (c) => { const x = document.createElement('td'); x.style.textAlign = alineacion(c.alinear); x.style.border = linea; x.style.height = (altoFila(e) * sc) + 'px'; return x; };
  if (e.titulos) {
    const fh = t.createTHead().insertRow();
    e.columnas.forEach((c) => {
      const th = document.createElement('th');
      th.textContent = c.titulo; th.style.textAlign = alineacion(c.alinear); th.style.border = linea;
      th.style.height = (altoFila(e) * sc) + 'px';
      if (e.relleno) th.style.background = e.relleno;
      fh.appendChild(th);
    });
  }
  const tb = t.createTBody();
  let filas;
  if (e.datos) {
    const l = datos[e.datos];
    if (!Array.isArray(l)) { avisos.add(e.datos + ' (debe ser una lista)'); filas = []; } else filas = l;
    filas.forEach((f) => {
      const fr = tb.insertRow();
      e.columnas.forEach((c) => {
        const td = celda(c); const v = rutaDe(f, c.campo);
        if (v === undefined) avisos.add(e.datos + '[].' + c.campo);
        td.textContent = formatear(v, c.formato); fr.appendChild(td);
      });
    });
  } else {
    const fr = tb.insertRow();
    e.columnas.forEach((c) => {
      const td = celda(c); const v = rutaDe(datos, c.campo);
      if (v === undefined) avisos.add(c.campo);
      td.textContent = formatear(v, c.formato); fr.appendChild(td);
    });
  }
  return t;
}

function previaElemento(e, datos, sc, avisos) {
  const pv = (mm) => (mm * sc) + 'px';

  if (e.tipo === 'linea') {
    const g = Math.max(1, e.grosor * sc);

    caja.appendChild(previaTabla(e, datos, sc, avisos));

    caja = div('pv-el', { left: pv(e.x), top: pv(e.y), width: pv(e.w), height: pv(e.h) });
    const c = div('c');

      if (e.borde > 0 || e.relleno) c.style.padding = (1 * sc) + 'px';
    } else if (e.tipo === 'logo') {
      const url = e.datos ? urlImagen(e) : '';
      if (url) { const img = document.createElement('img'); img.src = url; c.appendChild(img); }
      else { c.style.cssText += ';color:#94a3b8;border:1px dashed #cbd5e1;font-size:' + (8 * sc) + 'px;display:flex;align-items:center;justify-content:center'; c.textContent = e.nombre || 'logo'; }
    } else if (e.tipo === 'rectangulo') {
      c.style.border = Math.max(1, e.grosor * sc) + 'px solid #000';
      if (e.relleno) c.style.background = e.relleno;
    }
    caja.appendChild(c);
    if (e.tipo === 'rectangulo') hijosDe(e).forEach((h) => caja.appendChild(previaElemento(h, datos, sc, avisos)));
  }
  if (e.giro) caja.style.transform = `rotate(${e.giro}deg)`;
  return caja;
}

function pintarPrevia() {
  const cont = $('#previa-paginas');
  const av = $('#previa-avisos');
  let datos;
  try { datos = JSON.parse($('#previa-json').value); } catch (err) {
    av.className = 'error'; av.textContent = 'JSON no válido: ' + err.message; return false;
  }
  if (datos === null || typeof datos !== 'object' || Array.isArray(datos)) {
    av.className = 'error'; av.textContent = 'Los datos deben ser un objeto JSON ({ ... }).'; return false;
  }
  const avisos = new Set();
  const [W, H] = dims();
  const sc = MM * zoomPrevia;
  const pv = (mm) => (mm * sc) + 'px';
  let filas = [];
  if (Array.isArray(datos[doc.datos])) filas = datos[doc.datos]; else avisos.add(doc.datos + ' (lista del cuerpo)');
  const rh = altoFila({ tam: 9 });
  const area = H - doc.cabAlt - doc.pieAlt;
  const porPagina = Math.max(1, Math.floor((area - rh) / rh));
  const paginas = Math.max(1, Math.ceil(filas.length / porPagina));
  const m = doc.margen;
  const total = doc.columnas.reduce((a, c) => a + (+c.ancho || 0), 0) || 1;
  cont.innerHTML = '';
  for (let n = 0; n < paginas; n++) {
    const pag = div('pv-pagina', { width: pv(W), height: pv(H) });
    if (doc.marca) pag.appendChild(dibujarMarca(doc.marca, W, H, sc, false));
    doc.elementos.filter((e) => !esHijo(e)).forEach((e) => pag.appendChild(previaElemento(e, datos, sc, avisos)));
    // Tabla del cuerpo: una fila por elemento de la lista; la cabecera se repite en cada página.
    const t = document.createElement('table');
    t.className = 'pv-tabla';
    t.style.left = pv(m.izquierda); t.style.top = pv(doc.cabAlt); t.style.width = pv(W - m.izquierda - m.derecha);
    t.style.fontSize = (9 * PT * sc) + 'px';
    const cg = document.createElement('colgroup');
    doc.columnas.forEach((c) => { const col = document.createElement('col'); col.style.width = ((+c.ancho || 0) / total * 100) + '%'; cg.appendChild(col); });
    t.appendChild(cg);
    const fh = t.createTHead().insertRow();
    doc.columnas.forEach((c) => {
      const th = document.createElement('th');
      th.textContent = c.titulo; th.style.textAlign = alineacion(c.alinear); th.style.height = (rh * sc) + 'px';
      th.style.borderBottom = '1px solid #000';
      fh.appendChild(th);
    });
    const tb = t.createTBody();
    filas.slice(n * porPagina, (n + 1) * porPagina).forEach((f) => {
      const fr = tb.insertRow();
      doc.columnas.forEach((c) => {
        const td = fr.insertCell();
        const v = rutaDe(f, c.campo);
        if (v === undefined) avisos.add(doc.datos + '[].' + c.campo);
        td.textContent = formatear(v, c.formato); td.style.textAlign = alineacion(c.alinear); td.style.height = (rh * sc) + 'px';
        td.style.borderBottom = '1px solid #e2e8f0';
      });
    });
    pag.appendChild(t);
    cont.appendChild(pag);
    cont.appendChild(div('pv-num')).textContent = `Página ${n + 1} de ${paginas}`;
  }
  av.className = avisos.size ? 'error' : 'ayuda';
  av.textContent = avisos.size ? 'Sin datos para: ' + Array.from(avisos).join(', ') : `Todo resuelto. ${filas.length} línea(s), ${paginas} página(s).`;
  return true;
}

function abrirPrevia() {
  $('#previa-json').value = datosPruebaTexto();
  zoomPrevia = parseFloat($('#previa-zoom').value);

}

$('#previa-zoom').addEventListener('change', (ev) => { zoomPrevia = parseFloat(ev.target.value); pintarPrevia(); });

    d[doc.datos] = Array.from({ length: 60 }, (_, i) => Object.assign({}, base[i % base.length], { descripcion: `Línea ${i + 1}: ` + String(base[i % base.length].descripcion || '') }));
    $('#previa-json').value = JSON.stringify(d, null, 2);
    pintarPrevia();
  } catch (err) { pintarPrevia(); }
});

// Sugerencias para los campos «Datos» y «Campo» (desplegables de escritura libre).

    valores.forEach((v) => { const o = document.createElement('option'); o.value = v; d.appendChild(o); });
  };
  crear('dl-listas', Object.keys(LISTAS));
  crear('dl-campos-todos', TODOS_LOS_CAMPOS);

/* ------------------------------------------------------------------ */
/*  Servidor: guardar y lista de plantillas (Laravel o api/index.php)  */
/* ------------------------------------------------------------------ */
async function api(metodo, ruta, cuerpo) {
  const opc = { method: metodo, headers: { Accept: 'application/json' } };
  if (CONFIG.csrf) opc.headers['X-CSRF-TOKEN'] = CONFIG.csrf;   // Laravel lo exige en PUT, POST y DELETE
  if (cuerpo !== undefined) {
    opc.headers['Content-Type'] = 'application/json';
    opc.body = JSON.stringify(cuerpo);
  }
  const r = await fetch(API + ruta, opc);
  let datos = null;
  try { datos = await r.json(); } catch (e) { /* sin cuerpo JSON */ }
  if (!r.ok) {
    // error: nuestra API; message: errores propios de Laravel (sesión caducada, sin permiso…)
    const err = new Error((datos && (datos.error || datos.message)) || ('Error ' + r.status));
    err.estado = r.status;
    err.datos = datos;
    throw err;
  }
  return datos;
}
const urlPlantilla = (nombre) => 'plantillas/' + encodeURIComponent(nombre);

async function detectarServidor() {
  if (location.protocol === 'file:') {      // abierto como archivo: no hay API
    servidor = false;
    actualizarEstado();
    return;
  }
  try {
    const r = await api('GET', 'plantillas');
    servidor = !!(r && Array.isArray(r.plantillas));
  } catch (e) {
    servidor = false;
  }
  actualizarEstado();
}

// Guarda con el nombre actual: sobrescribe la plantilla del servidor o la crea si no existe.
// Devuelve true si se guardó. Si el servidor tiene otra versión (o ya existe una con ese nombre), pide confirmar.
async function guardar() {
  if (!servidor) { mensaje('No hay servidor: usa «Exportar XML».', true); return false; }
  const nombre = doc.nombre.trim();
  if (!nombre) { mensaje('La plantilla necesita un nombre.', true); return false; }
  if (doc.nombre !== nombre) { doc.nombre = nombre; panelElemento(); }
  clearTimeout(temporizador);
  commit();
  const xml = toXML();
  let version = esOrigen(nombre) ? origen.version : 0;
  for (let intento = 0; intento < 2; intento++) {
    try {
      const r = await api('PUT', urlPlantilla(nombre), { xml, version });
      origen = { nombre: r.nombre, version: r.version };
      guardadoXml = xml;
      guardarSesion();
      actualizarEstado();
      mensaje(`Guardada «${r.nombre}» (versión ${r.version}).`);
      return true;
    } catch (err) {
      const actual = err.datos && err.datos.version_actual;
      const aviso = err.estado === 409 && actual
        ? (err.datos.codigo === 'existe'
          ? `Ya existe una plantilla «${nombre}» en el servidor.`
          : `«${nombre}» ha cambiado en el servidor (versión ${actual}) desde que la abriste.`)
        : null;
      if (intento === 0 && aviso && confirm(aviso + '\n\n¿Sobrescribirla con lo que tienes en pantalla?')) {
        version = actual;      // el usuario acepta pisar la versión del servidor
        continue;
      }
      mensaje(aviso ? aviso + ' No se ha guardado.' : err.message, true);
      return false;
    }
  }
  return false;
}

// Guardar como: guarda lo que hay en pantalla con otro nombre y sigue editando esa copia.
async function guardarComo() {
  if (!servidor) { mensaje('No hay servidor: usa «Exportar XML».', true); return; }
  const anterior = doc.nombre;
  const n = prompt('Guardar como (nombre de la nueva plantilla):', esOrigen(anterior) ? anterior + ' copia' : anterior);
  if (n === null) return;
  const nombre = n.trim();
  if (!nombre) { mensaje('La plantilla necesita un nombre.', true); return; }
  doc.nombre = nombre;
  panelElemento();
  if (!(await guardar())) { doc.nombre = anterior; panelElemento(); actualizarEstado(); }
}

let listaDatos = [];

function msgLista(txt, error) {
  const m = $('#l-msg');
  m.textContent = txt || '';
  m.className = error ? 'error' : 'ayuda';
}
function abrirLista() {
  if (!servidor) return;
  $('#l-filtro').value = '';
  msgLista('');
  if (!$('#lista').open) $('#lista').showModal();
  cargarLista();
}
async function cargarLista() {
  $('#l-tabla').textContent = 'Cargando…';
  try {
    const r = await api('GET', 'plantillas');
    listaDatos = r.plantillas;
    pintarLista();
  } catch (err) {
    $('#l-tabla').textContent = '';
    msgLista(err.message, true);
  }
}
function boton(texto, alClic, clase) {
  const b = document.createElement('button');
  b.textContent = texto;
  if (clase) b.className = clase;
  b.addEventListener('click', alClic);
  return b;
}
function pintarLista() {
  const filtro = $('#l-filtro').value.trim().toLowerCase();
  const cont = $('#l-tabla');
  cont.innerHTML = '';
  const filas = listaDatos.filter((p) => p.nombre.toLowerCase().includes(filtro));
  if (!filas.length) {
    cont.appendChild(nota(listaDatos.length
      ? 'Ninguna plantilla coincide con el filtro.'
      : 'Aún no hay plantillas guardadas. Crea una y pulsa Guardar.'));
    return;
  }
  const tabla = document.createElement('table');
  tabla.className = 'tabla-lista';
  tabla.innerHTML = '<thead><tr><th>Nombre</th><th>Versión</th><th>Modificada</th><th></th></tr></thead>';
  const cuerpo = document.createElement('tbody');
  filas.forEach((p) => {
    const tr = document.createElement('tr');
    const actual = esOrigen(p.nombre);
    const tdNombre = document.createElement('td');
    tdNombre.textContent = p.nombre + (actual ? '  (abierta)' : '');
    if (actual) tdNombre.style.fontWeight = '600';
    const tdVersion = document.createElement('td');
    tdVersion.textContent = 'v' + p.version;
    const tdFecha = document.createElement('td');
    tdFecha.textContent = new Date(p.actualizada).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    const tdAcc = document.createElement('td');
    tdAcc.className = 'acciones';
    const xml = document.createElement('a');
    xml.className = 'boton';
    xml.textContent = 'XML';
    xml.title = 'Descargar el XML guardado en el servidor';
    xml.href = API + urlPlantilla(p.nombre) + '/xml';
    xml.setAttribute('download', '');
    tdAcc.append(
      boton('Abrir', () => abrirPlantilla(p.nombre), 'principal'),
      xml,
      boton('Duplicar', () => duplicarPlantilla(p.nombre)),
      boton('Borrar', () => borrarPlantilla(p.nombre), 'peligro'),
    );
    tr.append(tdNombre, tdVersion, tdFecha, tdAcc);
    cuerpo.appendChild(tr);
  });
  tabla.appendChild(cuerpo);
  cont.appendChild(tabla);
}
async function abrirPlantilla(nombre) {
  if (!descartar(`Hay cambios sin guardar. ¿Descartarlos y abrir «${nombre}»?`)) return;
  try {
    const r = await api('GET', urlPlantilla(nombre));
    empezar(fromXML(r.xml), { nombre: r.nombre, version: r.version });
    $('#lista').close();
    mensaje(`Abierta «${r.nombre}» (versión ${r.version}).`);
  } catch (err) {
    // Abierta al arrancar (?plantilla=…), la lista no está a la vista.
    if ($('#lista').open) msgLista(err.message, true); else mensaje(err.message, true);
  }
}
async function duplicarPlantilla(nombre) {
  const nuevo = prompt('Nombre de la copia:', nombre + ' copia');
  if (nuevo === null) return;
  try {
    const r = await api('POST', urlPlantilla(nombre) + '/duplicar', { nombre: nuevo.trim() });
    msgLista(`Creada «${r.nombre}».`);
    await cargarLista();
  } catch (err) {
    msgLista(err.message, true);
  }
}
async function borrarPlantilla(nombre) {
  if (!confirm(`¿Borrar «${nombre}» del servidor? No se puede deshacer.`)) return;
  try {
    await api('DELETE', urlPlantilla(nombre));
    if (esOrigen(nombre)) {
      origen = null; guardadoXml = '';
      guardarSesion(); actualizarEstado();
    }
    msgLista(`Borrada «${nombre}».`);
    await cargarLista();
  } catch (err) {
    msgLista(err.message, true);
  }
}
$('#l-cerrar').addEventListener('click', () => $('#lista').close());
$('#l-filtro').addEventListener('input', pintarLista);
$('#l-nueva').addEventListener('click', () => { if (nueva()) $('#lista').close(); });
$('#l-ejemplo').addEventListener('click', () => { if (ejemplo()) $('#lista').close(); });

(function iniciar() {
  try {
    const s = JSON.parse(localStorage.getItem(CLAVE_LS) || 'null');
    if (s && typeof s.xml === 'string') {
      doc = fromXML(s.xml);
      origen = s.origen && s.origen.nombre ? s.origen : null;
      guardadoXml = typeof s.guardado === 'string' ? s.guardado : '';
    }
  } catch (e) { /* sesión inválida o sin almacenamiento: se usa el ejemplo */ }
  if (CONFIG.volver) {
    $('#b-volver').href = CONFIG.volver;
    $('#b-volver').hidden = $('#sep-volver').hidden = false;
  }
  todo();
  commit();
  detectarServidor().then(() => {
    // Desde la lista del programa: ?plantilla=nombre abre esa; ?nueva, una vacía.
    if (CONFIG.abrir) abrirPlantilla(CONFIG.abrir);
    else if (CONFIG.nueva) nueva();
    // Sin los parámetros, recargar la página no la vuelve a abrir.
    if (CONFIG.abrir || CONFIG.nueva) history.replaceState(null, '', location.pathname);
  });
})();

// Pequeña API para pruebas desde la consola o desde scripts.
window.EditorPlantillas = {
  toXML, fromXML,
  getDoc: () => doc,
  setDoc: (d) => { doc = d; sel = null; todo(); commit(); },
  ejemplo: plantillaEjemplo,
};
